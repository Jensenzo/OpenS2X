[package]
name = "s2-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "s2-viewer"

[features]
# The investigation build of the long play (tools/span_log.rs): Bevy's
# system spans and wgpu's own scopes timed, the long ones logged. Never in
# the game's build.
frame-trace = ["bevy/trace", "bevy/debug", "dep:profiling"]

[dependencies]
# frame-trace: wgpu's profiling scopes as tracing spans (the version wgpu
# already brings; MIT OR Apache-2.0).
profiling = { version = "=1.0.18", default-features = false, features = ["profile-with-tracing"], optional = true }
s2-sim = { path = "../sim" }
s2-assets = { path = "../assets" }
s2-rules = { path = "../rules" }
s2-ai = { path = "../ai" }
# The films converted at install (docs/video.md): Motion-JPEG frames.
# Pure Rust, MIT OR Apache-2.0 OR Zlib.
zune-jpeg = "=0.4.21"
# Hook W30: the images embedded in a project's .glb model (the version
# Bevy's image reader already brings; MIT OR Apache-2.0).
png = "=0.18.1"
bevy = { version = "=0.20.0", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "default_font",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_gizmos_render",
    "bevy_anti_alias",
    "bevy_pbr",
    "bevy_post_process",
    # The 3D profile (3d_bevy_render) without glTF, its animation and morph
    # targets: the models are .gr2, read by s2-assets. (The tonemapping
    # tables are KTX2 with zstd.)
    "common_api",
    "bevy_light",
    "bevy_mikktspace",
    "smaa_luts",
    "tonemapping_luts",
    "zstd_rust",
] }

# SND: sound and music through Bevy's audio, for the game's platform. On
# Linux it would need the ALSA development files; there the program runs
# without sound.
[target.'cfg(windows)'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["bevy_audio", "wav", "mp3"] }
# The game folder picker of the first run.
rfd = "=0.17.2"
# SET-1.1: the documents folder, where the profile files are; the play
# harness reads the system's pointer (GetCursorPos, F41) and keeps the
# display on while it runs (tools/play/display.rs).
windows-sys = { version = "=0.61.2", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
] }
# The window's Win32 handle, for the pointer read (the version Bevy uses).
raw-window-handle = "=0.6.2"
