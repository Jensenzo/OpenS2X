<svg xmlns="http://www.w3.org/2000/svg" width="832" height="502" viewBox="0 0 832 502" role="img" aria-label="Ticks equal to the original per recorded game">
<title>Ticks equal to the original per recorded game</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; font-size: 13px; }
.title { font-size: 15px; font-weight: 600; fill: #1f2328; }
.game { font-weight: 600; fill: #1f2328; }
.value { font-variant-numeric: tabular-nums; }
.track { fill: #818b98; fill-opacity: 0.22; }
.bar { fill: #0969da; }
.bar.all { fill: #1a7f37; }
.bg { fill: #ffffff; stroke: #d1d9e0; }
@media (prefers-color-scheme: dark) {
  text { fill: #9198a1; }
  .title, .game { fill: #f0f6fc; }
  .track { fill-opacity: 0.45; }
  .bar { fill: #4493f8; }
  .bar.all { fill: #3fb950; }
  .bg { fill: #0d1117; stroke: #3d444d; }
}
</style>
<rect class="bg" x="0.5" y="0.5" width="831" height="501" rx="6"/>
<g transform="translate(16,16)">
<text class="title" x="0" y="18">How long each recorded game stays equal to the original</text>
<text x="0" y="40">Bar: tick 1 to the last tick before the first difference. Track: the range compared.</text>
<text class="game" x="0" y="68">Two players, Weak computer player</text>
<text class="measure" x="12" y="99">settlers' places, buildings</text>
<rect class="track" x="310" y="88" width="330" height="14" rx="3"/>
<rect class="bar all" x="310" y="88" width="330.0" height="14" rx="3"/>
<text class="value" x="650" y="99">40,000 of 40,000</text>
<text class="measure" x="12" y="129">with animation, to tick 6,000</text>
<rect class="track" x="310" y="118" width="330" height="14" rx="3"/>
<rect class="bar all" x="310" y="118" width="330.0" height="14" rx="3"/>
<text class="value" x="650" y="129">6,000 of 6,000</text>
<text class="measure" x="12" y="159">with animation, to tick 20,000</text>
<rect class="track" x="310" y="148" width="330" height="14" rx="3"/>
<rect class="bar all" x="310" y="148" width="330.0" height="14" rx="3"/>
<text class="value" x="650" y="159">20,000 of 20,000</text>
<text class="measure" x="12" y="189">the random generator</text>
<rect class="track" x="310" y="178" width="330" height="14" rx="3"/>
<rect class="bar" x="310" y="178" width="131.0" height="14" rx="3"/>
<text class="value" x="650" y="189">59,529 of 150,000</text>
<text class="game" x="0" y="222">One player, no computer player</text>
<text class="measure" x="12" y="253">every settler and building</text>
<rect class="track" x="310" y="242" width="330" height="14" rx="3"/>
<rect class="bar all" x="310" y="242" width="330.0" height="14" rx="3"/>
<text class="value" x="650" y="253">30,000 of 30,000</text>
<text class="measure" x="12" y="283">the random generator</text>
<rect class="track" x="310" y="272" width="330" height="14" rx="3"/>
<rect class="bar all" x="310" y="272" width="330.0" height="14" rx="3"/>
<text class="value" x="650" y="283">30,000 of 30,000</text>
<text class="game" x="0" y="316">Two players, Strong computer player</text>
<text class="measure" x="12" y="347">every settler, with animation</text>
<rect class="track" x="310" y="336" width="330" height="14" rx="3"/>
<rect class="bar all" x="310" y="336" width="330.0" height="14" rx="3"/>
<text class="value" x="650" y="347">20,000 of 20,000</text>
<text class="measure" x="12" y="377">buildings and the random generator</text>
<rect class="track" x="310" y="366" width="330" height="14" rx="3"/>
<rect class="bar all" x="310" y="366" width="330.0" height="14" rx="3"/>
<text class="value" x="650" y="377">20,000 of 20,000</text>
<text class="measure" x="12" y="407">long run: settlers, buildings, generator</text>
<rect class="track" x="310" y="396" width="330" height="14" rx="3"/>
<rect class="bar" x="310" y="396" width="119.7" height="14" rx="3"/>
<text class="value" x="650" y="407">54,399 of 150,000</text>
<text x="0" y="444">Green: no difference in the range. The first row leaves out the settlers' animation (a recorder's lag).</text>
<text x="0" y="462">A tick is a tenth of a second. From docs/fidelity.md's record.</text>
</g>
</svg>
